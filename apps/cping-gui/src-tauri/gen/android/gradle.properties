# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=false
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Our old plugin template had a bug that caused missing `consumer-rules.pro` files
# so we have to disable it for now.
# See https://github.com/tauri-apps/tauri/pull/15828#issuecomment-5199937796
android.proguard.failOnMissingFiles=false

# Keeping Gradle 9 compatible with current plugins
# TODO: Remove this in v3
android.builtInKotlin=false
android.newDsl=false

# CPing: JDK 17 要求
#
# ⚠️ 这里**不要**写 `org.gradle.java.home=<绝对路径>`。
# 本机系统默认是 JDK 26，而 AGP 不支持，所以需要 JDK 17——但那是一个
# **机器专属的绝对路径**（本机为 `D:/Program Files/Android/jdk-17`）。
# 一旦提交进仓库，CI（Linux）就会报：
#   Value 'D:/Program Files/Android/jdk-17' given for org.gradle.java.home
#   Gradle property is invalid (Java home supplied is invalid)
# 也就是「本地能打、CI 全红」。
#
# 正确做法：用 JAVA_HOME 表达，不进仓库。
#   - CI：actions/setup-java 已经设置好 JAVA_HOME，无需额外配置；
#   - 本地：`scripts/build-all.cmd` 已经 `set JAVA_HOME=...\jdk-17`；
#     手工直接跑 `npx tauri android build` 时，先在该终端里设好 JAVA_HOME。
# 需要临时覆盖时，也可以放在用户级 `~/.gradle/gradle.properties`（不入库）。

# CPing: 关闭 Kotlin 增量编译。
# 原因：tauri-plugin-* 的 Kotlin 源码来自 cargo registry（C 盘），而本工程在 D 盘，
# Kotlin 增量缓存用 `File.relativeTo()` 计算相对路径时因「different roots」抛
# IllegalArgumentException，导致每个 module 都要回退到「无 daemon 编译」，
# 既慢又刷屏。关掉增量编译后直接走一次性编译，稳定可预期。
kotlin.incremental=false
