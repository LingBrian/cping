# GUI 作为**独立 workspace**：它的依赖树（tauri/wry/tao…）远大于核心与 TUI，
# 独立出来可以让 `cargo build --workspace`（核心 + TUI）保持秒级构建。
# 共享逻辑仍然通过 path 依赖 cping-core，不存在第二份实现。
[workspace]

[package]
name = "cping-gui"
description = "CPing 图形界面（Tauri 2 容器）"
version = "2.5.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[lib]
name = "cping_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# M12：可选异步调度。把 `cping-core` 的 `async` feature 透传到壳里，
# 默认**不开启**，因此默认的桌面 / Android 包不含 Tokio（保持依赖面最小）。
# 界面会如实显示当前构建是否带异步调度（探测方式提示区）。
async-scheduler = ["cping-core/async"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 重要：resolver v2 下 build-dependencies 与 [dependencies] 的 feature **分开解析**，
# 因此这一条必须在这里再声明一次，否则 tauri-build → tauri-utils → schemars 那条链
# 仍然拿到没有 `std` feature 的 indexmap 1.x。（原因详见 [dependencies] 中的注释）
indexmap = { version = "1.9", features = ["std"] }

[dependencies]
# ---------------------------------------------------------------------------
# 这一条**不是**给本项目用的依赖，而是修复上游的构建问题：
#   indexmap 1.x 的 `std` feature 默认关闭，其 build.rs 在 CARGO_FEATURE_STD 缺失时
#   会用 autocfg 探测 sysroot 里的 std crate；该探测在受限环境下失败，导致
#   `has_std` cfg 未生效，indexmap 退化成 `IndexMap<K, V, S>`（无默认泛型参数），
#   进而使 schemars 0.8（tauri-utils 在 preserve_order 下使用）编译失败：
#     error[E0107]: struct takes 3 generic arguments but 2 generic arguments were supplied
#   显式启用 `std` 后 build.rs 走 `autocfg::emit("has_std")` 快路径，问题消失。
# ---------------------------------------------------------------------------
indexmap = { version = "1.9", features = ["std"] }

cping-core = { path = "../../../crates/cping-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
