[workspace]
resolver = "2"
members = ["crates/cping-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["CPing rewrite"]

[workspace.dependencies]
cping-core = { path = "crates/cping-core" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
