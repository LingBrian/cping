name: CI

# 合并门槛：格式、clippy、全量测试、前端类型检查与构建。
# 刻意分成独立 job——任一项失败都能一眼看出是哪一类问题。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # CI 上被依赖的 crate 只有一个（cping-gui 的 tauri 链），
  # 核心 cping-core 仍是零第三方运行时依赖。
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 核心：格式 / 静态检查 / 全量测试（Linux，跑得最全）
  # ---------------------------------------------------------------------------
  core:
    name: core (fmt + clippy + test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy（warnings 视为错误）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: 验证默认构建不引入第三方运行时依赖
        # M12 的硬约束：async feature 默认关闭时，cping-core 的依赖树里
        # 不应出现任何外部 crate。这里用「本地路径依赖计数」来守这条线。
        run: |
          set -euo pipefail
          cargo tree -p cping-core -e normal --prefix none > /tmp/tree.txt
          echo "--- cping-core 依赖 ---"
          cat /tmp/tree.txt
          count=$(grep -c . /tmp/tree.txt || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::cping-core 默认构建出现了额外的依赖项（期望只有自身），共 $count 行"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 前端：类型检查 + 生产构建
  # ---------------------------------------------------------------------------
  gui-frontend:
    name: gui frontend (typecheck + build)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/cping-gui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/cping-gui/package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 生产构建
        run: npm run build

  # ---------------------------------------------------------------------------
  # 桌面壳：确认 Tauri 侧能编译（Linux 需要 webkit2gtk 等系统库）
  # ---------------------------------------------------------------------------
  gui-shell:
    name: gui shell (cargo check)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: 安装 Rust 工具链
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/cping-gui/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 构建前端产物（tauri 编译期需要 dist/）
        working-directory: apps/cping-gui
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: cargo check（桌面壳）
        working-directory: apps/cping-gui/src-tauri
        run: cargo check --locked

  # ---------------------------------------------------------------------------
  # Windows：x64 与 x86 两种架构都要能编译（发布矩阵的前置保障）
  # ---------------------------------------------------------------------------
  windows:
    name: windows (x64 + x86)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-msvc i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: cargo test（x64）
        run: cargo test --workspace

      - name: cargo build（x86，仅编译不跑测试）
        run: cargo build --release --workspace --exclude cping-gui --target i686-pc-windows-msvc

  # ---------------------------------------------------------------------------
  # Android：交叉编译检查（不产 APK，APK 由 release.yml 负责）
  # ---------------------------------------------------------------------------
  android:
    name: android (cross-compile check)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链与 Android 目标
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2

      - name: 配置 NDK 工具链
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            echo "::error::未找到 NDK（ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME）"
            exit 1
          fi
          BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "AR=$BIN/llvm-ar"             >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$BIN/llvm-ar"                       >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CC_armv7_linux_androideabi=$BIN/armv7a-linux-androideabi24-clang" >> "$GITHUB_ENV"
          echo "AR_armv7_linux_androideabi=$BIN/llvm-ar"                            >> "$GITHUB_ENV"
          echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$BIN/armv7a-linux-androideabi24-clang" >> "$GITHUB_ENV"

      - name: cargo check（arm64-v8a）
        run: cargo check --locked -p cping-core --target aarch64-linux-android

      - name: cargo check（armeabi-v7a）
        run: cargo check --locked -p cping-core --target armv7-linux-androideabi
